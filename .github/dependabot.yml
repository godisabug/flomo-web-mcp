version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    ignore:
      # @types/node tracks the minimum supported Node.js version (package.json#engines); bump it by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Require Node.js >= 22.12; adopt them in 0.3.0 together with the new engines minimum.
      - dependency-name: vitest
        versions: [">=5"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
